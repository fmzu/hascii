name: デプロイ

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    name: チェック
    runs-on: ubuntu-latest
    steps:
      - name: 👩‍💻 チェックアウト
        uses: actions/checkout@v4
      - name: 🔨 Bunを有効にする
        uses: oven-sh/setup-bun@v1
      - name: 🔨 インストール
        run: bun install
      - name: 🧪 テスト
        run: bun test
  deploy:
    name: デプロイ
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 👩‍💻 チェックアウト
        uses: actions/checkout@v4
      - name: 🔨 Bunを有効にする
        uses: oven-sh/setup-bun@v1
      - name: 🔨 インストール
        run: bun install
      - name: 💪 ビルド
        run: bun run --cwd ui build
      - name: 🚀 デプロイ API
        uses: cloudflare/wrangler-action@v3
        with:
          packageManager: bun
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy index.ts --name=hascii-api
          workingDirectory: api
      - name: 🚀 デプロイ ウェブサイト
        uses: cloudflare/wrangler-action@v3
        with:
          packageManager: bun
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy ./build/client --project-name=hascii
          workingDirectory: ui
